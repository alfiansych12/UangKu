name: Build & Release Android APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Prepare Secrets and Environment
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          # 1. Provide placeholder google-services.json if not present
          if [ ! -f "app/google-services.json" ]; then
            cat > app/google-services.json <<'JSON'
            {
              "project_info": {
                "project_number": "0",
                "project_id": "dummy",
                "storage_bucket": "dummy.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:0:android:0",
                    "android_client_info": {
                      "package_name": "com.aistudio.uangku.tracker"
                    }
                  },
                  "api_key": [
                    {
                      "current_key": "dummy"
                    }
                  ]
                }
              ]
            }
          JSON
          fi

          # 2. Provide .env from secrets and fallback to .env.example
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if [ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]; then
            echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID}" >> .env
          fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
          fi

          # 3. Decode debug.keystore if base64 file exists, or generate via keytool
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair \
                -v \
                -keystore debug.keystore \
                -storepass android \
                -keypass android \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          test -f debug.keystore

          echo "=========================================="
          echo "Debug Keystore SHA-1 Fingerprint:"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" || true
          echo "=========================================="

      - name: Ensure Gradle Wrapper Executable
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper with Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1 || gradle wrapper || true
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            test -x ./gradlew
          else
            echo "gradlew is missing and could not be generated."
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Djava.awt.headless=true -Dkotlin.daemon.jvm.options=-Xmx2048m"
        run: |
          set -euo pipefail

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-configuration-cache \
            -Djava.awt.headless=true \
            -x test \
            -x testDebugUnitTest \
            -x verifyRoborazziDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UangKu-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
